<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Instrument selector options</title>
<!-- Disposable comparison, November 2, 2026. Nothing here is implemented in the app. Instruments, categories and market
     figures are a static snapshot of Hyperliquid's public /info API embedded in this file; the page makes no venue
     requests. Graphite and Daylight values are copied from frontend/src/features/settings/themes.ts. Layout idea: every
     option opens from the same instrument field in a simplified Play page, so only the selector differs. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  color-scheme: dark;
  --background: #0f1114; --foreground: #e9edf2; --card: #171a1f; --secondary: #1e2229; --accent: #242932;
  --field: #111419; --muted-foreground: #abb3c0; --border: #394350; --primary: #c5cfdd; --primary-foreground: #11161d;
  --ring: #9ab5f2; --positive: #a9d6b6; --negative: #f2b3ac; --warning: #edd49e; --shadow: rgb(0 0 0 / .55);
  --radius: 7px; --font: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
}
:root[data-skin="daylight"] {
  color-scheme: light;
  --background: #edf2f8; --foreground: #0f1b2d; --card: #fbfdff; --secondary: #e4ebf5; --accent: #d7e1ef;
  --field: #ffffff; --muted-foreground: #46566c; --border: #b9c7d9; --primary: #2353b0; --primary-foreground: #ffffff;
  --ring: #2353b0; --positive: #13774a; --negative: #b3262f; --warning: #7f5200; --shadow: rgb(15 27 45 / .22);
  --radius: 8px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--background); }
body { color: var(--foreground); font: 400 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--positive); } .down { color: var(--negative); } .dim { color: var(--muted-foreground); }

/* Comparison bar */
.bar { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--card); position: relative; z-index: 60; }
.bar h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.opts { display: flex; gap: 4px; flex-wrap: wrap; }
.opts button { display: flex; gap: 7px; align-items: baseline; padding: 6px 11px; border: 1px solid transparent; border-radius: var(--radius); background: none; color: var(--muted-foreground); font-size: 13px; font-weight: 500; }
.opts button b { font-size: 11px; font-weight: 600; opacity: .75; }
.opts button:hover { background: var(--secondary); color: var(--foreground); }
.opts button[aria-selected="true"] { background: var(--accent); border-color: var(--border); color: var(--foreground); }
.tools { margin-left: auto; display: flex; gap: 8px; align-items: center; position: relative; }
.tool { padding: 6px 11px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--secondary); font-size: 13px; font-weight: 500; }
.tool:hover { background: var(--accent); }
.sources { position: absolute; top: calc(100% + 8px); right: 0; width: 320px; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); box-shadow: 0 18px 44px var(--shadow); }
.sources h2 { margin: 0 0 2px; font-size: 13px; font-weight: 600; }
.sources p { margin: 0 0 10px; font-size: 12px; color: var(--muted-foreground); }
.sources label { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center; padding: 5px 0; font-size: 13px; cursor: pointer; }
.sources label small { color: var(--muted-foreground); font-size: 12px; }
.sources label.fixed { cursor: default; }

/* Simplified Play page */
.stage { position: relative; display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: 860px; overflow: hidden; }
.side { border-right: 1px solid var(--border); padding: 20px 14px; display: grid; align-content: start; gap: 4px; background: var(--card); font-size: 13px; color: var(--muted-foreground); }
.side strong { font-size: 16px; color: var(--foreground); padding: 0 8px 14px; font-weight: 700; letter-spacing: -.02em; }
.side span { padding: 6px 8px; border-radius: var(--radius); }
.side .on { background: var(--accent); color: var(--foreground); }
.page { padding: 22px 26px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.page h2 { margin: 0; font-size: 26px; font-weight: 650; letter-spacing: -.03em; }
.ctx { position: relative; border: 1px solid var(--border); border-radius: calc(var(--radius) * 1.8); background: var(--card); padding: 16px 20px; display: grid; gap: 14px; }
.ctx-row { display: grid; grid-template-columns: 1fr 1.3fr 1.3fr 1fr; gap: 22px; }
.fld { display: grid; gap: 6px; min-width: 0; align-content: start; }
.fld > span { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-foreground); }
.fake { padding: 8px 0; font-size: 14px; font-weight: 500; }
.dirs { display: flex; gap: 6px; }
.dirs i { font-style: normal; padding: 6px 12px; border-radius: var(--radius); border: 1px solid var(--border); font-size: 13px; font-weight: 600; }
.dirs i:first-child { color: var(--positive); }
.dirs i:last-child { color: var(--negative); border-color: transparent; }
.trigger { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 38px; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--field); text-align: left; font-weight: 600; }
.trigger:hover { border-color: var(--ring); }
.trigger[aria-expanded="true"] { border-color: var(--ring); }
.trigger svg { margin-left: auto; flex: none; color: var(--muted-foreground); }
.note { display: block; font-size: 12px; color: var(--warning); line-height: 1.4; }
.badge { display: inline-block; padding: 0 5px; border: 1px solid var(--border); border-radius: 4px; font-size: 11px; font-weight: 600; line-height: 16px; letter-spacing: .02em; color: var(--muted-foreground); white-space: nowrap; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.tiles div { display: grid; gap: 7px; padding: 4px 12px; font-size: 12px; color: var(--muted-foreground); border-right: 1px solid var(--border); }
.tiles div:last-child { border: 0; }
.tiles i { display: block; height: 16px; width: 64%; border-radius: 4px; background: var(--secondary); }
.work { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 14px; }
.box { border: 1px solid var(--border); border-radius: calc(var(--radius) * 1.8); background: var(--card); }
.chart { padding: 14px; min-height: 420px; display: grid; gap: 8px; align-content: start; }
.chart svg { width: 100%; height: 370px; display: block; }
.chart header { font-size: 13px; color: var(--muted-foreground); display: flex; gap: 14px; flex-wrap: wrap; }
.chart header b { color: var(--foreground); font-weight: 600; }
.editor { padding: 16px; display: grid; gap: 12px; align-content: start; }
.editor i { display: block; height: 34px; border-radius: var(--radius); background: var(--secondary); }
.editor i.s { height: 12px; width: 40%; }

/* Shared selector pieces */
.search { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--field); outline-offset: 0; }
.search::placeholder { color: var(--muted-foreground); }
.scrim { position: absolute; inset: 0; z-index: 30; background: color-mix(in srgb, var(--background) 62%, transparent); }
.panel { position: absolute; z-index: 40; border: 1px solid var(--border); border-radius: calc(var(--radius) * 1.5); background: var(--card); box-shadow: 0 22px 60px var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
.chip { padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: none; font-size: 12px; font-weight: 500; color: var(--muted-foreground); white-space: nowrap; }
.chip:hover { color: var(--foreground); background: var(--secondary); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--foreground); border-color: var(--ring); }
.chip small { font-size: 11px; opacity: .78; margin-left: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pick { cursor: pointer; }
.pick.hl { background: var(--accent); }
.pick.cur .sym { color: var(--ring); }
.sym { font-weight: 600; }
.empty { padding: 24px 14px; color: var(--muted-foreground); font-size: 13px; text-align: center; }
kbd { padding: 0 5px; border: 1px solid var(--border); border-radius: 4px; font: 500 11px/16px var(--font); color: var(--muted-foreground); }
.hints { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 12px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted-foreground); }

/* 1 Cascade */
.cascade { left: var(--anchor, 240px); top: 170px; width: min(760px, calc(100% - var(--anchor, 240px) - 24px)); height: 470px; }
.cascade .top { padding: 10px; border-bottom: 1px solid var(--border); }
.cols { flex: 1; min-height: 0; display: grid; grid-template-columns: 170px 170px minmax(0, 1fr); }
.col { overflow: auto; border-right: 1px solid var(--border); padding: 6px; display: grid; align-content: start; gap: 1px; }
.col:last-child { border: 0; }
.col h3 { margin: 4px 8px 6px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-foreground); }
.step { display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; border: 0; border-radius: var(--radius); background: none; text-align: left; font-size: 13px; color: var(--muted-foreground); }
.step:hover { background: var(--secondary); color: var(--foreground); }
.step[aria-pressed="true"] { background: var(--accent); color: var(--foreground); font-weight: 600; }
.step small { font-size: 12px; font-variant-numeric: tabular-nums; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: var(--radius); font-size: 13px; }
.row > span { min-width: 0; display: flex; gap: 6px; align-items: center; }
.row small { font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }

/* 2 Palette */
.palette { left: 50%; top: 60px; transform: translateX(-50%); width: min(860px, calc(100% - 32px)); height: 560px; }
.palette .top { padding: 12px 14px 10px; border-bottom: 1px solid var(--border); display: grid; gap: 10px; }
.palette .search { border: 0; background: none; padding: 4px 2px; font-size: 19px; font-weight: 500; letter-spacing: -.01em; outline: none; }
.split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 280px; }
.res { overflow: auto; padding: 6px; }
.res h3 { margin: 10px 8px 4px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-foreground); }
.res h3:first-child { margin-top: 4px; }
.peek { border-left: 1px solid var(--border); padding: 18px; display: grid; gap: 12px; align-content: start; background: var(--secondary); overflow: auto; }
.peek strong { font-size: 24px; font-weight: 650; letter-spacing: -.02em; line-height: 1.1; }
.peek dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; }
.peek dt { color: var(--muted-foreground); }
.peek dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }

/* 3 Market map */
.mapd { inset: 16px; }
.mapd .top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.mapd .search { width: 220px; }
.legend { margin-left: auto; font-size: 12px; color: var(--muted-foreground); display: flex; gap: 6px; align-items: center; }
.legend i { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }
.treemap { position: relative; flex: 1; min-height: 0; margin: 8px; }
.block { position: absolute; }
.block > button { position: absolute; left: 0; right: 0; top: 0; height: 22px; display: flex; gap: 6px; align-items: center; padding: 0 4px; border: 0; background: none; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-foreground); }
.block > button:hover { color: var(--foreground); }
.tile { position: absolute; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; border: 1px solid var(--card); border-radius: 3px; padding: 2px; color: var(--foreground); text-align: center; line-height: 1.2; }
.tile:hover, .tile.hl { outline: 2px solid var(--ring); outline-offset: -2px; z-index: 2; }
.tile.cur { box-shadow: inset 0 0 0 2px var(--foreground); }
.tile .sym { font-size: var(--fs, 12px); font-weight: 650; }
.tile small { font-size: 11px; font-variant-numeric: tabular-nums; }
.tile.more { background: var(--secondary); color: var(--muted-foreground); font-size: 12px; font-weight: 500; }
.tile.fade { opacity: .22; }

/* 4 Screener */
.drawer { top: 0; right: 0; bottom: 0; width: min(820px, 100%); border-radius: 0; border-width: 0 0 0 1px; }
.drawer .top { padding: 14px; display: grid; gap: 10px; border-bottom: 1px solid var(--border); }
.drawer .top h3 { margin: 0; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.x { border: 1px solid var(--border); background: none; border-radius: var(--radius); padding: 2px 9px; font-size: 12px; color: var(--muted-foreground); }
.scroll { flex: 1; min-height: 0; overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { position: sticky; top: 0; z-index: 2; background: var(--card); padding: 0; border-bottom: 1px solid var(--border); text-align: right; }
th:first-child, td:first-child { text-align: left; padding-left: 14px; }
th button { width: 100%; padding: 8px 10px; border: 0; background: none; text-align: inherit; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-foreground); }
th[aria-sort] button { color: var(--foreground); }
th:first-child button { padding-left: 0; }
td { padding: 7px 10px; text-align: right; border-bottom: 1px solid color-mix(in srgb, var(--border) 45%, transparent); font-variant-numeric: tabular-nums; white-space: nowrap; }
td.l, th.l { text-align: left; }
tbody tr:hover { background: var(--secondary); }

/* 5 Shelf */
.shelf { display: grid; gap: 12px; padding-top: 14px; border-top: 1px solid var(--border); }
.shelf-head { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; }
.seg { display: flex; flex-wrap: wrap; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.seg button { padding: 6px 12px; border: 0; border-right: 1px solid var(--border); background: none; font-size: 13px; font-weight: 500; color: var(--muted-foreground); }
.seg button:last-child { border: 0; }
.seg button:hover { color: var(--foreground); background: var(--secondary); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--foreground); font-weight: 600; }
.seg small { font-size: 11px; opacity: .75; margin-left: 3px; }
.recent { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted-foreground); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 6px; max-height: 300px; overflow: auto; padding: 1px; }
.cardlet { padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--field); display: grid; gap: 2px; font-size: 13px; }
.cardlet:hover { border-color: var(--ring); }
.cardlet.hl { border-color: var(--ring); background: var(--accent); }
.cardlet div { display: flex; justify-content: space-between; gap: 6px; align-items: center; }
.cardlet small { font-size: 12px; font-variant-numeric: tabular-nums; }
.shelf-in { font-weight: 600; }

/* Notes */
.notes { padding: 20px 26px 30px; border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; background: var(--card); }
.notes h2 { grid-column: 1 / -1; margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.015em; }
.notes h3 { margin: 0 0 4px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-foreground); }
.notes p { margin: 0; font-size: 13px; max-width: 46ch; }
.source-line { grid-column: 1 / -1; font-size: 12px; color: var(--muted-foreground); }

@media (max-width: 1080px) { .work { grid-template-columns: 1fr; } .editor { display: none; } }
@media (max-width: 760px) {
  .bar { padding: 10px 16px; } .tools { margin-left: 0; }
  .opts { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; }
  .opts button { white-space: nowrap; }
  .sources { right: auto; left: 0; width: min(320px, calc(100vw - 32px)); }
  .stage { grid-template-columns: minmax(0, 1fr); min-height: 780px; }
  .side { display: none; }
  .page { padding: 16px; }
  .ctx-row { grid-template-columns: 1fr 1fr; gap: 14px; }
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .tiles div:nth-child(2) { border: 0; }
  .chart svg { height: 200px; } .chart { min-height: 0; }
  .cascade, .palette, .mapd { inset: 0; width: 100%; height: 100%; transform: none; border-radius: 0; border-width: 0; }
  .cols { display: flex; flex-direction: column; }
  .col { flex: none; display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border); padding: 6px 10px; gap: 4px; }
  .col h3 { display: none; }
  .col .step { flex: none; }
  .col:last-child { flex: 1; display: grid; overflow: auto; border: 0; }
  .split { grid-template-columns: minmax(0, 1fr); }
  .peek { display: none; }
  .legend { display: none; }
  .mapd .search { width: 100%; }
  .col-hide { display: none; }
  .notes { grid-template-columns: 1fr; padding: 16px; gap: 14px; }
  .bar h1 { width: 100%; }
}
@media (prefers-reduced-motion: no-preference) {
  .panel { animation: rise .12s ease-out; }
  @keyframes rise { from { opacity: .4; } to { opacity: 1; } }
}
</style>
</head>
<body>
<div class="bar">
  <h1>Instrument selector options</h1>
  <div class="opts" role="tablist" aria-label="Selector options" id="opts"></div>
  <div class="tools">
    <button class="tool" id="skin" type="button">Daylight</button>
    <button class="tool" id="srcBtn" type="button" aria-expanded="false" aria-haspopup="dialog">Market sources</button>
    <div class="sources" id="sources" role="dialog" aria-label="Market sources" hidden></div>
  </div>
</div>
<div class="stage" id="stage">
  <nav class="side" aria-hidden="true"><strong>vessel</strong><span>Overview</span><span class="on">Plays</span><span>Review</span><span>Portfolios</span><span>Accounts</span><span>Activity</span></nav>
  <main class="page">
    <h2>New play</h2>
    <section class="ctx" id="ctx"></section>
    <div class="tiles" aria-hidden="true"><div>Swing book balance<i></i></div><div>Wallet total<i></i></div><div>Available<i></i></div><div>Perps equity<i></i></div></div>
    <div class="work">
      <section class="box chart"><header id="chartHead"></header><svg id="chartSvg" viewBox="0 0 800 370" preserveAspectRatio="none" aria-hidden="true"></svg></section>
      <aside class="box editor" aria-hidden="true"><i class="s"></i><i></i><i class="s"></i><i></i><i></i><i class="s"></i><i></i><i></i></aside>
    </div>
  </main>
  <div id="layer"></div>
</div>

const sourceFull = i => DATA.dexes[i.dex] || 'Hyperliquid'
const badge = i => i.dex ? `<span class="badge">${esc(source(i))}</span>` : ''
const hay = i => [i.id, i.sym, ...i.kw, i.dex, sourceFull(i), catName[i.cat]].join(' ').toLowerCase()

function search(items, q) {
  const words = q.toLowerCase().trim().split(/\s+/).filter(Boolean)
  const scopes = words.filter(w => w.startsWith('@')).map(w => w.slice(1))
  const terms = words.filter(w => !w.startsWith('@'))
  const out = []
  for (const i of items) {
    if (scopes.some(w => !w || !(i.dex.startsWith(w) || i.cat.startsWith(w) || catName[i.cat].toLowerCase().startsWith(w)))) continue
    const h = hay(i)
    if (!terms.every(t => h.includes(t))) continue
    const t = terms[0] || ''; const sym = i.sym.toLowerCase()
    const score = !t ? 2 : sym === t ? 0 : sym.startsWith(t) || i.kw.includes(t) ? 1 : 2
    out.push([score, i])
  }
  return out.sort((a, b) => a[0] - b[0] || b[1].vol - a[1].vol).map(x => x[1])
}
const countBy = (items, key) => items.reduce((m, i) => (m[i[key]] = (m[i[key]] || 0) + 1, m), {})
const filtered = () => {
  let items = search(pool(), S.q)
  if (S.cat !== 'all') items = items.filter(i => i.cat === S.cat)
  if (S.dex !== 'all') items = items.filter(i => i.dex === S.dex)
  return items
}

/* 3 Market map */
function squarify(items, x, y, w, h) {
  const total = items.reduce((s, i) => s + i.w, 0), scale = (w * h) / (total || 1)
  const out = []; let rest = items.map(i => ({ ...i, a: i.w * scale })), X = x, Y = y, W = w, H = h
  const worst = (r, s) => { const sum = r.reduce((t, i) => t + i.a, 0), mx = Math.max(...r.map(i => i.a)), mn = Math.min(...r.map(i => i.a)); return Math.max(s * s * mx / (sum * sum), sum * sum / (s * s * mn)) }
  while (rest.length) {
    const side = Math.min(W, H) || 1; const r = [rest[0]]; let n = 1
    while (n < rest.length && worst([...r, rest[n]], side) <= worst(r, side)) { r.push(rest[n]); n++ }
    const sum = r.reduce((t, i) => t + i.a, 0)
    if (W >= H) { const cw = sum / (H || 1); let cy = Y; for (const i of r) { const ch = i.a / (cw || 1); out.push({ ...i, x: X, y: cy, w: cw, h: ch }); cy += ch } X += cw; W -= cw }
    else { const ch = sum / (W || 1); let cx = X; for (const i of r) { const cw = i.a / (ch || 1); out.push({ ...i, x: cx, y: Y, w: cw, h: ch }); cx += cw } Y += ch; H -= ch }
    rest = rest.slice(n)
  }
  return out
}
const heat = v => {
  if (v == null || v === 0) return 'var(--secondary)'
  const p = Math.round(Math.min(42, 10 + Math.abs(v) * 7))
  return `color-mix(in srgb, var(--${v > 0 ? 'positive' : 'negative'}) ${p}%, var(--card))`
}
function tile(i, x, y, w, h, faded) {
  const big = w > 62 && h > 40
  const fs = Math.max(11, Math.min(20, Math.sqrt(w * h) / 5.4))
  const show = w > 34 && h > 17
  return `<button type="button" class="tile pick${curClass(i)}${faded ? ' fade' : ''}" ${pickAttr(i, `${i.sym}/USDC${i.dex ? ` on ${source(i)}` : ''}, ${pct(i.chg)}, volume ${money(i.vol)}`)} title="${esc(`${i.sym}/USDC ${pct(i.chg)} · ${money(i.vol)}`)}" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;width:${w.toFixed(1)}px;height:${h.toFixed(1)}px;background:${heat(i.chg)};--fs:${fs.toFixed(1)}px">${show ? `<span class="sym">${esc(i.sym)}</span>` : ''}${big ? `<small>${pct(i.chg)}${i.dex ? ` · ${esc(source(i))}` : ''}</small>` : ''}</button>`
}
function mapHtml() {
  const counts = countBy(pool(), 'cat')
  return `<div class="scrim" data-close></div><div class="panel mapd" role="dialog" aria-label="Choose an instrument">
    <div class="top"><input class="search" id="q" aria-label="Highlight instruments" placeholder="Highlight, e.g. gold" autocomplete="off" spellcheck="false" value="${esc(S.q)}">

      <div class="legend"><span>Size: 24h volume</span><span>−5%</span><i style="background:${heat(-5)}"></i><i style="background:${heat(-1)}"></i><i style="background:var(--secondary)"></i><i style="background:${heat(1)}"></i><i style="background:${heat(5)}"></i><span>+5%</span></div>
      <button class="x" type="button" data-close>Close</button></div>
    <div class="treemap" id="treemap" role="listbox" aria-label="Instruments"></div></div>`
}
function drawMap() {
  const el = $('#treemap'); if (!el) return
  const W = el.clientWidth, H = el.clientHeight
  const small = W < 600
  const limit = S.mapCat ? 200 : small ? 12 : 42
  const hits = S.q.trim() ? new Set(search(pool(), S.q).map(i => i.id)) : null
  const groups = CATS.map(([k, n]) => {
    const all = pool().filter(i => i.cat === k && (!S.mapCat || S.mapCat === k)).sort((a, b) => b.vol - a.vol)
    return { k, n, all, top: all.slice(0, limit), w: Math.sqrt(all.reduce((s, i) => s + Math.sqrt(i.vol + 1e4), 0)) ** 1.4 }
  }).filter(g => g.all.length).sort((a, b) => b.w - a.w)
  el.innerHTML = squarify(groups, 0, 0, W, H).map(g => {
    const pad = 22, innerH = Math.max(0, g.h - pad - 3), innerW = Math.max(0, g.w - 3)
    const more = g.all.length - g.top.length
    const leaves = g.top.map(i => ({ i, w: Math.sqrt(i.vol + 1e4) }))
    if (more) leaves.push({ more, w: Math.max(leaves.at(-1).w * 3, leaves[0].w * .08) })
    leaves.sort((a, b) => b.w - a.w)
    const inner = squarify(leaves, 0, pad, innerW, innerH).map(t => t.more
      ? `<button type="button" class="tile more" data-map="${g.k}" style="left:${t.x.toFixed(1)}px;top:${t.y.toFixed(1)}px;width:${t.w.toFixed(1)}px;height:${t.h.toFixed(1)}px">+${t.more}</button>`
      : tile(t.i, t.x, t.y, t.w, t.h, hits && !hits.has(t.i.id))).join('')
    return `<div class="block" style="left:${g.x.toFixed(1)}px;top:${g.y.toFixed(1)}px;width:${g.w.toFixed(1)}px;height:${g.h.toFixed(1)}px"><button type="button" data-map="${g.k}">${g.n} <span class="dim">${g.all.length}</span></button>${inner}</div>`
  }).join('')
}

  if (S.sort) items = [...items].sort((a, b) => {

  return `<div class="panel drawer" role="dialog" aria-label="Choose an instrument">

    <div class="scroll"><table><thead><tr>${th('sym', 'Asset')}${th('cat', 'Category', 'l col-hide')}${th('dex', 'Source', 'l col-hide')}${th('lev', 'Max lev')}${th('chg', '24h')}${th('vol', 'Volume', 'col-hide')}</tr></thead>

/* Rendering and interaction */
const picks = () => [...document.querySelectorAll('.pick')]
function hilite(n, scroll) {
  const all = picks(); if (!all.length) { peek(null); return }
  S.active = Math.max(0, Math.min(all.length - 1, n))
  all.forEach((e, x) => e.classList.toggle('hl', x === S.active))
  if (scroll) all[S.active].scrollIntoView({ block: 'nearest' })
  peek(byId(all[S.active].dataset.pick))
}
function render(focus) {
  const prev = document.activeElement?.id === 'q' ? document.activeElement.selectionStart : null
  renderBar(); renderNotes()
  const html = !S.open ? '' : { cascade: cascadeHtml, palette: paletteHtml, map: mapHtml, screener: screenerHtml, shelf: () => '' }[S.opt]()
  $('#layer').innerHTML = html
  renderCtx()
  if (S.open && S.opt === 'map') drawMap()
  if (S.open) hilite(S.active)
  const q = $('#q')
  if (q && (focus || prev !== null)) { q.focus({ preventScroll: true }); if (prev !== null) q.setSelectionRange(prev, prev) }
  else if (!S.open && focus) $('#trigger')?.focus({ preventScroll: true })
}
function choose(id) { S.sel = id; S.open = false; S.q = ''; S.active = 0; render(true) }
function setOpt(id) { S.opt = id; S.open = true; S.q = ''; S.cat = 'all'; S.dex = 'all'; S.facets.clear(); S.mapCat = null; S.active = 0; try { history.replaceState(null, '', `#${id}`) } catch { /* framed viewers */ } render() }
function reset() { S.active = 0; render() }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-opt],[data-pick],[data-choose],[data-cat],[data-dexf],[data-dex="all"],[data-facet],[data-sort],[data-map],[data-close]')
  if (e.target.closest('#srcBtn')) { S.srcOpen = !S.srcOpen; renderBar(); return }
  if (S.srcOpen && !e.target.closest('#sources')) { S.srcOpen = false; renderBar() }
  if (!t) {
    if (e.target.closest('.bar')) return
    if (S.open && S.opt !== 'shelf' && !e.target.closest('.panel,.trigger')) { S.open = false; render() }
    else if (S.open && S.opt === 'shelf' && !e.target.closest('.ctx,.trigger')) { S.open = false; render() }
    return
  }
  const d = t.dataset
  if (d.opt) return setOpt(d.opt)
  if (d.pick) return choose(d.pick)
  if (d.choose) return choose(d.choose)
  if ('close' in d) { S.open = false; return render(true) }
  if (d.cat) { S.cat = d.cat; return reset() }
  if (d.dex === 'all') { S.dex = 'all'; return reset() }
  if ('dexf' in d) { S.dex = d.dexf; return reset() }
  if (d.facet) { S.facets.has(d.facet) ? S.facets.delete(d.facet) : S.facets.add(d.facet); return reset() }
  if (d.sort) { if (S.sort === d.sort) S.dir = -S.dir; else { S.sort = d.sort; S.dir = d.sort === 'sym' || d.sort === 'cat' || d.sort === 'dex' ? 1 : -1 } return reset() }
  if ('map' in d) { S.mapCat = d.map || null; return reset() }
})
document.addEventListener('change', e => {
  const d = e.target.dataset?.dex
  if (!d) return
  if (e.target.checked) S.on[d] = true; else delete S.on[d]
  if (S.dex === d) S.dex = 'all'
  S.active = 0; render()
})
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; S.active = 0; render() } })
document.addEventListener('focusin', e => { if (e.target.id === 'q' && !S.open) { S.open = true; render() } })
document.addEventListener('keydown', e => {
  if (!S.open) return
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); hilite(S.active + (e.key === 'ArrowDown' ? 1 : -1), true) }
  else if (e.key === 'Enter') { const el = picks()[S.active]; if (el && document.activeElement?.closest('button') == null) { e.preventDefault(); choose(el.dataset.pick) } }
  else if (e.key === 'Escape') { e.preventDefault(); S.open = false; S.q = ''; render(true) }
  else if (e.key === 'Tab' && S.opt === 'palette') { e.preventDefault(); cycle(e.shiftKey ? -1 : 1) }
  else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && S.opt === 'cascade' && !S.q) { e.preventDefault(); cycle(e.key === 'ArrowRight' ? 1 : -1) }
})
function cycle(step) {
  const counts = countBy(search(pool(), S.q), 'cat')
  const list = ['all', ...CATS.map(c => c[0]).filter(k => counts[k])]
  S.cat = list[(list.indexOf(S.cat) + step + list.length) % list.length]
  reset()
}
$('#skin').addEventListener('click', e => {
  const r = document.documentElement, day = r.dataset.skin === 'daylight'
  if (day) delete r.dataset.skin; else r.dataset.skin = 'daylight'
  e.target.textContent = day ? 'Daylight' : 'Graphite'
})
addEventListener('resize', () => { if (S.open && S.opt === 'map') drawMap(); renderCtx() })
addEventListener('hashchange', () => { const id = location.hash.slice(1); if (OPTIONS.some(o => o.id === id) && id !== S.opt) setOpt(id) })
renderChart()
const initial = location.hash.slice(1)
if (OPTIONS.some(o => o.id === initial)) S.opt = initial
render()
document.fonts?.ready.then(() => renderCtx())
</script>
</body>
