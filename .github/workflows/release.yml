name: Release

# Pushing an annotated vX.Y.Z tag that is on main runs the foundation checks,
# builds both images once and hands them to both release verifications and to
# publication as a workflow artifact, publishes skorcius/vessel:api-X.Y.Z and
# web-X.Y.Z only when the pushed images are the verified ones, moves both latest
# tags and creates the GitHub Release from docs/releases/vX.Y.Z.md plus both
# image digests. Branch pushes and pull requests (Dependabot's included) consume
# no CI runner time. Actions are pinned to commit SHAs and checkouts keep no token.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # Re-run a release from its tag: choose the tag under "Use workflow from".
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Release source
    # A manual dispatch from a branch must not allocate a runner either.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require an annotated tag on main
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::Run the release from a vX.Y.Z tag, not $GITHUB_REF."
            exit 1
          fi
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" "+refs/heads/main:refs/remotes/origin/main"
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != tag ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag. Create release tags with git tag -a."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Merge the release before tagging it."
            exit 1
          fi
      - name: Versions, changelog and release notes
        run: python3 scripts/release.py check --tag "$GITHUB_REF_NAME"

  checks:
    name: Foundation checks
    needs: source
    uses: ./.github/workflows/checks.yml

  images:
    name: Build images once
    needs: source
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    # A later attempt of this run reuses the pair an earlier attempt built (see the first two steps).
    outputs:
      api-config-digest: ${{ steps.build.outputs.api-config-digest || steps.reuse.outputs.api-config-digest }}
      web-config-digest: ${{ steps.build.outputs.web-config-digest || steps.reuse.outputs.web-config-digest }}
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          persist-credentials: false
      # "Re-run all jobs" after a partial publication must publish the pair the first attempt verified, not a rebuild:
      # artifacts belong to the run, so a later attempt finds the earlier upload under the same name.
      - name: Images an earlier attempt of this run built
        id: earlier
        if: github.run_attempt != '1'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-images
          path: ${{ runner.temp }}/images
      - name: Reuse them without building
        id: reuse
        if: steps.earlier.outcome == 'success'
        run: python3 scripts/release.py identify --revision "$GITHUB_SHA" --input "$RUNNER_TEMP/images"
      - name: Build and save both images
        id: build
        if: steps.earlier.outcome != 'success'
        run: python3 scripts/release.py build --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/images"
      # Verification and publication load these bytes; nothing run-scoped is pushed to the public registry.
      # Without overwrite the upload fails when the run already has the artifact, so a failed download above can
      # never replace the pair an earlier attempt verified or published.
      - if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-images
          path: ${{ runner.temp }}/images/
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  verify:
    name: Release verification (${{ matrix.storage }})
    needs: [source, images]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    strategy:
      matrix:
        storage: [s3, local]
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install
      # Sign-in is wallet-only: the check binds and signs in with a synthetic, publicly known EOA. Its signer
      # libraries install from their committed lockfile outside the checkout and the application's dependencies.
      - name: Synthetic wallet signer
        run: |
          mkdir -p "$RUNNER_TEMP/wallet-signer"
          cp scripts/wallet-signer/package.json scripts/wallet-signer/pnpm-lock.yaml "$RUNNER_TEMP/wallet-signer/"
          pnpm --dir "$RUNNER_TEMP/wallet-signer" install --frozen-lockfile
          echo "NOBLE_MODULE_DIR=$RUNNER_TEMP/wallet-signer/node_modules" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-images
          path: ${{ runner.temp }}/images
      - name: Load the images built once
        id: load
        env:
          API_CONFIG_DIGEST: ${{ needs.images.outputs.api-config-digest }}
          WEB_CONFIG_DIGEST: ${{ needs.images.outputs.web-config-digest }}
        run: >-
          python3 scripts/release.py load --revision "$GITHUB_SHA" --input "$RUNNER_TEMP/images"
          --api-config-digest "$API_CONFIG_DIGEST" --web-config-digest "$WEB_CONFIG_DIGEST"
      - name: Isolated images, transport, sign-in, restore
        env:
          API_IMAGE: ${{ steps.load.outputs.api-image }}
          WEB_IMAGE: ${{ steps.load.outputs.web-image }}
          STORAGE: ${{ matrix.storage }}
        run: python3 scripts/verify-release.py --storage "$STORAGE" --api-image "$API_IMAGE" --web-image "$WEB_IMAGE"

  publish:
    name: Publish images
    needs: [source, checks, images, verify]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment:
      name: docker-hub
      url: https://hub.docker.com/r/skorcius/vessel/tags
    concurrency:
      group: docker-hub-publish
      cancel-in-progress: false
    outputs:
      api-digest: ${{ steps.publish.outputs.api-digest }}
      web-digest: ${{ steps.publish.outputs.web-digest }}
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-images
          path: ${{ runner.temp }}/images
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'skorcius' }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Set the DOCKERHUB_TOKEN secret on the docker-hub environment, then re-run this job."
            exit 1
          fi
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      # Pushes the verified images and fails when a pushed config digest differs from the verified one.
      - name: Push the verified images, compare digests, then move latest
        id: publish
        env:
          API_CONFIG_DIGEST: ${{ needs.images.outputs.api-config-digest }}
          WEB_CONFIG_DIGEST: ${{ needs.images.outputs.web-config-digest }}
        run: >-
          python3 scripts/release.py publish --revision "$GITHUB_SHA" --input "$RUNNER_TEMP/images"
          --api-config-digest "$API_CONFIG_DIGEST" --web-config-digest "$WEB_CONFIG_DIGEST"
      - name: Log out
        if: always()
        run: docker logout

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          persist-credentials: false
      - name: Release body with both image digests
        env:
          API_DIGEST: ${{ needs.publish.outputs.api-digest }}
          WEB_DIGEST: ${{ needs.publish.outputs.web-digest }}
        run: >-
          python3 scripts/release.py notes --tag "$GITHUB_REF_NAME" --api-digest "$API_DIGEST"
          --web-digest "$WEB_DIGEST" --output "$RUNNER_TEMP/release-notes.md"
      - name: Create or update the release from its notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Vessel $GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Vessel $GITHUB_REF_NAME" --notes-file "$notes"
          fi
