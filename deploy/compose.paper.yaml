# Optional standalone paper worker. Requires a paper-capable image and explicit
# journal migration; never apply to an older image. The standalone paper
# scheduler uses no broker, command queue or messaging envelope schema.
# Include this overlay and --profile paper on every relevant Compose command.
services:
  worker-paper:
    profiles: ["paper"]
    image: skorcius/vessel:api-${VESSEL_VERSION:?Set VESSEL_VERSION to a paper-capable image}
    entrypoint: ["/app/worker"]
    environment:
      - DOTNET_ENVIRONMENT=Production
      - Vessel__Worker__Modules__0=paper
      - Vessel__Worker__Deployment=paper
      - "ConnectionStrings__Vessel=Host=postgres;Database=vessel;Username=vessel;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      # The same sign-in settings as compose.yaml's x-identity-environment (anchors do not cross files):
      # the worker reads the identity owner directory.
      - Vessel__Auth__OwnerId=${Vessel__Auth__OwnerId:?Set a non-empty GUID}
      - Vessel__Auth__OwnerName=${Vessel__Auth__OwnerName:-Owner}
      - Vessel__Identity__Origins__0=${VESSEL_IDENTITY_ORIGIN:?Set the public HTTPS origin, without a path}
      - Vessel__Identity__Registration=${VESSEL_IDENTITY_REGISTRATION:-Closed}
      - Vessel__Identity__AllowLegacyDefaultOwner=${VESSEL_ALLOW_LEGACY_DEFAULT_OWNER:-false}
    # Public candles only: no credential key-ring/evidence mount or published port.
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/worker-health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    restart: unless-stopped
