# Token remains the default. To opt in to wallet sign-in, see README "Sign-in mode"
# and include compose.wallet.yaml on all commands (plus an HTTPS proxy).
services:
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${VESSEL_S3_ACCESS_KEY_ID:-}
      RUSTFS_SECRET_KEY: ${VESSEL_S3_SECRET_ACCESS_KEY:-}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "false"
    # No built-in/default credentials, even if the operator forgot to configure them.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - ': "$${RUSTFS_ACCESS_KEY:?Set VESSEL_S3_ACCESS_KEY_ID}" "$${RUSTFS_SECRET_KEY:?Set VESSEL_S3_SECRET_ACCESS_KEY}"; exec /entrypoint.sh rustfs'
    volumes:
      - objects:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  storage-init:
    image: amazon/aws-cli:2.38.1
    environment:
      AWS_ACCESS_KEY_ID: ${VESSEL_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${VESSEL_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${VESSEL_S3_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      VESSEL_S3_BUCKET: ${VESSEL_S3_BUCKET:-vessel-evidence}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'aws s3api head-bucket --bucket "$$VESSEL_S3_BUCKET" >/dev/null 2>&1 || aws s3api create-bucket --bucket "$$VESSEL_S3_BUCKET" >/dev/null'
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: vessel
      POSTGRES_USER: vessel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      # TCP, not the socket: on first start the image's temporary init server
      # accepts socket connections briefly, which let migrate start too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U vessel -d vessel"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.6-management
    hostname: vessel-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    # AMQP stays on the private network. The management page is for troubleshooting, loopback by default.
    ports:
      - "${VESSEL_RABBITMQ_MANAGEMENT_BIND:-127.0.0.1:15672}:15672"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped

  migrate:
    image: skorcius/vessel:api-${VESSEL_VERSION:-0.3.1}
    # EF migrations, then explicit messaging provisioning with the broker administrator.
    # Nothing is migrated or provisioned at API or worker startup.
    entrypoint: ["/app/migrate"]
    environment:
      ConnectionStrings__Vessel: "Host=postgres;Database=vessel;Username=vessel;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Vessel__Auth__Mode: ${VESSEL_AUTH_MODE:-Token}
      Vessel__Auth__Token: ${Vessel__Auth__Token:-}
      Vessel__Auth__OwnerId: ${Vessel__Auth__OwnerId:?Set a non-empty GUID}
      Vessel__Messaging__RabbitMqUri: "amqp://${RABBITMQ_USER:?Set RABBITMQ_USER}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@rabbitmq:5672/"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  api:
    image: skorcius/vessel:api-${VESSEL_VERSION:-0.3.1}
    environment:
      ConnectionStrings__Vessel: "Host=postgres;Database=vessel;Username=vessel;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      # Required by the API in Token mode; Wallet overlay explicitly clears it.
      Vessel__Auth__Mode: ${VESSEL_AUTH_MODE:-Token}
      Vessel__Auth__Token: ${Vessel__Auth__Token:-}
      Vessel__Auth__OwnerId: ${Vessel__Auth__OwnerId:?Set a non-empty GUID}
      Vessel__Auth__OwnerName: ${Vessel__Auth__OwnerName:-Owner}
      Vessel__Evidence__Storage__Provider: S3
      Vessel__Evidence__Storage__S3__Endpoint: ${VESSEL_S3_ENDPOINT:-http://rustfs:9000}
      Vessel__Evidence__Storage__S3__Bucket: ${VESSEL_S3_BUCKET:-vessel-evidence}
      Vessel__Evidence__Storage__S3__Region: ${VESSEL_S3_REGION:-us-east-1}
      Vessel__Evidence__Storage__S3__ForcePathStyle: ${VESSEL_S3_FORCE_PATH_STYLE:-true}
      Vessel__Evidence__Storage__S3__AccessKeyId: ${VESSEL_S3_ACCESS_KEY_ID:-}
      Vessel__Evidence__Storage__S3__SecretAccessKey: ${VESSEL_S3_SECRET_ACCESS_KEY:-}
      Vessel__Messaging__RabbitMqUri: "amqp://${RABBITMQ_APP_USER:-${RABBITMQ_USER:?Set RABBITMQ_USER}}:${RABBITMQ_APP_PASSWORD:-${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}}@rabbitmq:5672/"
      Vessel__Monitor__Interval: ${VESSEL_MONITOR_INTERVAL:-00:10:00}
      Vessel__Monitor__ProtectionGrace: ${VESSEL_MONITOR_PROTECTION_GRACE:-00:10:00}
      Vessel__Monitor__ManualCooldown: ${VESSEL_MONITOR_MANUAL_COOLDOWN:-00:01:00}
      # Nginx emits one sanitized hop, in both HTTP and TLS modes.
      Vessel__ForwardedHeaders__KnownProxies__0: ${VESSEL_WEB_IP:-172.30.86.10}
      Vessel__ForwardedHeaders__ForwardLimit: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # The monitor module and the replica-safe event maintenance. worker-notifications runs the same
  # image with the notifications module (deploy/README.md).
  worker:
    image: skorcius/vessel:api-${VESSEL_VERSION:-0.3.1}
    entrypoint: ["/app/worker"]
    environment:
      DOTNET_ENVIRONMENT: Production
      Vessel__Worker__Modules__0: monitor
      Vessel__Worker__Deployment: monitor
      ConnectionStrings__Vessel: "Host=postgres;Database=vessel;Username=vessel;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Vessel__Auth__Mode: ${VESSEL_AUTH_MODE:-Token}
      Vessel__Auth__Token: ${Vessel__Auth__Token:-}
      Vessel__Auth__OwnerId: ${Vessel__Auth__OwnerId:?Set a non-empty GUID}
      Vessel__Messaging__RabbitMqUri: "amqp://${RABBITMQ_APP_USER:-${RABBITMQ_USER:?Set RABBITMQ_USER}}:${RABBITMQ_APP_PASSWORD:-${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}}@rabbitmq:5672/"
      Vessel__Monitor__Interval: ${VESSEL_MONITOR_INTERVAL:-00:10:00}
      Vessel__Monitor__ProtectionGrace: ${VESSEL_MONITOR_PROTECTION_GRACE:-00:10:00}
      Vessel__Monitor__ManualCooldown: ${VESSEL_MONITOR_MANUAL_COOLDOWN:-00:01:00}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/worker-health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    restart: unless-stopped

  # The Notification Hub: the notifications subscription, in-app notifications and their retention.
  # It never opens venue tokens, so it needs no credential key ring.
  worker-notifications:
    image: skorcius/vessel:api-${VESSEL_VERSION:-0.3.1}
    entrypoint: ["/app/worker"]
    environment:
      DOTNET_ENVIRONMENT: Production
      Vessel__Worker__Modules__0: notifications
      Vessel__Worker__Deployment: notifications
      ConnectionStrings__Vessel: "Host=postgres;Database=vessel;Username=vessel;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Vessel__Auth__Mode: ${VESSEL_AUTH_MODE:-Token}
      Vessel__Auth__Token: ${Vessel__Auth__Token:-}
      Vessel__Auth__OwnerId: ${Vessel__Auth__OwnerId:?Set a non-empty GUID}
      Vessel__Messaging__RabbitMqUri: "amqp://${RABBITMQ_APP_USER:-${RABBITMQ_USER:?Set RABBITMQ_USER}}:${RABBITMQ_APP_PASSWORD:-${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}}@rabbitmq:5672/"
      Vessel__Monitor__Interval: ${VESSEL_MONITOR_INTERVAL:-00:10:00}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/worker-health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    restart: unless-stopped

  web:
    image: skorcius/vessel:web-${VESSEL_VERSION:-0.3.1}
    environment:
      VESSEL_API_UPSTREAM: ${VESSEL_API_UPSTREAM:-http://api:8080}
      VESSEL_TRUSTED_PROXY: ${VESSEL_TRUSTED_PROXY:-}
    networks:
      default:
        ipv4_address: ${VESSEL_WEB_IP:-172.30.86.10}
    ports:
      - "${VESSEL_WEB_BIND:-127.0.0.1:8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: ${VESSEL_NETWORK_SUBNET:-172.30.86.0/24}
          gateway: ${VESSEL_NETWORK_GATEWAY:-172.30.86.1}

volumes:
  postgres:
  objects:
  rabbitmq:
