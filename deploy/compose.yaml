# Vessel signs in with wallets only and needs HTTPS: use compose.tls.yaml or your own
# HTTPS proxy, and see README "Sign-in" before the first start.

# Sign-in settings that migrate, the API and both workers must read identically.
x-identity-environment: &identity-environment
  Vessel__Auth__OwnerId: ${Vessel__Auth__OwnerId:?Set a non-empty GUID}
  Vessel__Auth__OwnerName: ${Vessel__Auth__OwnerName:-Owner}
  Vessel__Identity__Origins__0: ${VESSEL_IDENTITY_ORIGIN:?Set the public HTTPS origin, without a path}
  # Closed admits linked wallets only; see README before choosing Invitation.
  Vessel__Identity__Registration: ${VESSEL_IDENTITY_REGISTRATION:-Closed}
  Vessel__Identity__AllowLegacyDefaultOwner: ${VESSEL_ALLOW_LEGACY_DEFAULT_OWNER:-false}
  # Retired Token sign-in settings, passed on only so a stale .env refuses to start instead of being ignored.
  Vessel__Auth__Mode: ${VESSEL_AUTH_MODE:-Wallet}
  Vessel__Auth__Token: ${Vessel__Auth__Token:-}

# Every service (issue #105): capped json-file logs, no privilege gain and no Linux capabilities except those a
# service adds back. Anchors do not cross files, so compose.tls.yaml and compose.paper.yaml repeat this block.
x-hardening: &hardening
  logging:
    driver: json-file
    options:
      max-size: ${VESSEL_LOG_MAX_SIZE:-10m}
      max-file: ${VESSEL_LOG_MAX_FILE:-5}
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# PostgreSQL starts as root, fixes its data volume's ownership and switches to its own user.
x-root-entrypoint-capabilities: &root-entrypoint-capabilities
  - CHOWN
  - DAC_OVERRIDE
  - SETUID
  - SETGID

services:
  rustfs:
    <<: *hardening
    image: rustfs/rustfs:1.0.1
    read_only: true
    tmpfs:
      - /tmp:size=64m
    environment:
      RUSTFS_ACCESS_KEY: ${VESSEL_S3_ACCESS_KEY_ID:-}
      RUSTFS_SECRET_KEY: ${VESSEL_S3_SECRET_ACCESS_KEY:-}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "false"
      # Log to stdout, where the capped Docker log keeps it, not to a file in the read-only image.
      RUSTFS_OBS_LOG_DIRECTORY: ""
    # No built-in/default credentials, even if the operator forgot to configure them.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - ': "$${RUSTFS_ACCESS_KEY:?Set VESSEL_S3_ACCESS_KEY_ID}" "$${RUSTFS_SECRET_KEY:?Set VESSEL_S3_SECRET_ACCESS_KEY}"; exec /entrypoint.sh rustfs'
    volumes:
      - objects:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  storage-init:
    <<: *hardening
    image: amazon/aws-cli:2.38.1
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      AWS_ACCESS_KEY_ID: ${VESSEL_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${VESSEL_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${VESSEL_S3_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      VESSEL_S3_BUCKET: ${VESSEL_S3_BUCKET:-vessel-evidence}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'aws s3api head-bucket --bucket "$$VESSEL_S3_BUCKET" >/dev/null 2>&1 || aws s3api create-bucket --bucket "$$VESSEL_S3_BUCKET" >/dev/null'
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  postgres:
    <<: *hardening
    image: postgres:18-alpine
    cap_add: *root-entrypoint-capabilities
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /var/run/postgresql:size=1m
    environment:
      POSTGRES_DB: vessel
      POSTGRES_USER: vessel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      # TCP, not the socket: on first start the image's temporary init server
      # accepts socket connections briefly, which let migrate start too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U vessel -d vessel"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    <<: *hardening
    image: skorcius/vessel:api-${VESSEL_VERSION:-0.4.2}
    read_only: true
    tmpfs:
      - /tmp:size=64m
    # EF migrations, then the explicit subscription registrations (provision-messaging).
    # Nothing is migrated or provisioned at API or worker startup.
    entrypoint: ["/app/migrate"]
    environment:
      <<: *identity-environment
      ConnectionStrings__Vessel: "Host=postgres;Database=vessel;Username=vessel;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  api:
    <<: *hardening
    image: skorcius/vessel:api-${VESSEL_VERSION:-0.4.2}
    read_only: true
    volumes:
      # On disk, not in memory: a Play export (up to 50 images) and an upload are staged here.
      - api-tmp:/tmp
    environment:
      <<: *identity-environment
      ConnectionStrings__Vessel: "Host=postgres;Database=vessel;Username=vessel;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Vessel__Evidence__Storage__Provider: S3
      Vessel__Evidence__Storage__S3__Endpoint: ${VESSEL_S3_ENDPOINT:-http://rustfs:9000}
      Vessel__Evidence__Storage__S3__Bucket: ${VESSEL_S3_BUCKET:-vessel-evidence}
      Vessel__Evidence__Storage__S3__Region: ${VESSEL_S3_REGION:-us-east-1}
      Vessel__Evidence__Storage__S3__ForcePathStyle: ${VESSEL_S3_FORCE_PATH_STYLE:-true}
      Vessel__Evidence__Storage__S3__AccessKeyId: ${VESSEL_S3_ACCESS_KEY_ID:-}
      Vessel__Evidence__Storage__S3__SecretAccessKey: ${VESSEL_S3_SECRET_ACCESS_KEY:-}
      Vessel__Monitor__Interval: ${VESSEL_MONITOR_INTERVAL:-00:10:00}
      Vessel__Monitor__ProtectionGrace: ${VESSEL_MONITOR_PROTECTION_GRACE:-00:10:00}
      Vessel__Monitor__ManualCooldown: ${VESSEL_MONITOR_MANUAL_COOLDOWN:-00:01:00}
      # Nginx emits one sanitized hop, in both HTTP and TLS modes.
      Vessel__ForwardedHeaders__KnownProxies__0: ${VESSEL_WEB_IP:-172.30.86.10}
      Vessel__ForwardedHeaders__ForwardLimit: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    # Longer than the host's 30-second shutdown timeout, so Docker never kills a draining request or run.
    stop_grace_period: 40s
    restart: unless-stopped

  # The monitor module and the replica-safe event maintenance. worker-notifications runs the same
  # image with the notifications module (deploy/README.md).
  worker:
    <<: *hardening
    image: skorcius/vessel:api-${VESSEL_VERSION:-0.4.2}
    entrypoint: ["/app/worker"]
    read_only: true
    tmpfs:
      # The heartbeat file lives here.
      - /tmp:size=16m
    environment:
      <<: *identity-environment
      DOTNET_ENVIRONMENT: Production
      Vessel__Worker__Modules__0: monitor
      Vessel__Worker__Deployment: monitor
      ConnectionStrings__Vessel: "Host=postgres;Database=vessel;Username=vessel;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Vessel__Monitor__Interval: ${VESSEL_MONITOR_INTERVAL:-00:10:00}
      Vessel__Monitor__ProtectionGrace: ${VESSEL_MONITOR_PROTECTION_GRACE:-00:10:00}
      Vessel__Monitor__ManualCooldown: ${VESSEL_MONITOR_MANUAL_COOLDOWN:-00:01:00}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/worker-health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    # Longer than the host's 30-second shutdown timeout, so an in-flight run can release its lease.
    stop_grace_period: 40s
    restart: unless-stopped

  # The Notification Hub: the notifications subscription, in-app notifications and their retention.
  # It never opens venue tokens, so it needs no credential key ring.
  worker-notifications:
    <<: *hardening
    image: skorcius/vessel:api-${VESSEL_VERSION:-0.4.2}
    entrypoint: ["/app/worker"]
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      <<: *identity-environment
      DOTNET_ENVIRONMENT: Production
      Vessel__Worker__Modules__0: notifications
      Vessel__Worker__Deployment: notifications
      ConnectionStrings__Vessel: "Host=postgres;Database=vessel;Username=vessel;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Vessel__Monitor__Interval: ${VESSEL_MONITOR_INTERVAL:-00:10:00}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/worker-health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    # Longer than the host's 30-second shutdown timeout, so an in-flight run can release its lease.
    stop_grace_period: 40s
    restart: unless-stopped

  web:
    <<: *hardening
    image: skorcius/vessel:web-${VESSEL_VERSION:-0.4.2}
    read_only: true
    tmpfs:
      # nginx's pid, request body and proxy buffers, and the trusted-proxy file written at start.
      - /tmp:size=64m
      # The start script renders the site configuration here; nginx (UID 101) must own it.
      - /etc/nginx/conf.d:size=1m,uid=101,gid=101,mode=0755
    environment:
      VESSEL_API_UPSTREAM: ${VESSEL_API_UPSTREAM:-http://api:8080}
      VESSEL_TRUSTED_PROXY: ${VESSEL_TRUSTED_PROXY:-}
    networks:
      default:
        ipv4_address: ${VESSEL_WEB_IP:-172.30.86.10}
    ports:
      - "${VESSEL_WEB_BIND:-127.0.0.1:8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/index.html"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: ${VESSEL_NETWORK_SUBNET:-172.30.86.0/24}
          gateway: ${VESSEL_NETWORK_GATEWAY:-172.30.86.1}

volumes:
  postgres:
  objects:
  api-tmp:
