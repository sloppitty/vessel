# Repeat this include in locations with add_header, which replaces inheritance.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# The camera is for scanning a pairing QR code on the sign-in screen, from this origin only.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
# Theme/chart positioning uses style attributes. Scripts remain self-only.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
